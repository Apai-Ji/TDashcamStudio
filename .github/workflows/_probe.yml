name: Token probe
on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try creating a draft release with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- token permissions are printed in 'Set up job' above ---"
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{"tag_name":"probe-delete-me","name":"probe","draft":true}')
          echo "HTTP $code"
          cat /tmp/body
          if [ "$code" = "201" ]; then
            id=$(jq -r .id /tmp/body)
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/releases/$id
            echo "probe release deleted"
          fi
